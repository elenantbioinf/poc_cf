
#################This is the config.yml############################################
# Samples
samples_table_path: "config/samples.tsv"

##############################################################
paths:
  raw_reads: "data/raw"
  paired_end: true
  clean_reads: "data/clean"
  results_dir: "results"
  logs_dir: "logs"
  visual_dir: "visual"
  final_report_dir: "final_report"
  reports_dir: "reports"

##############################################################
# Automatic generation of DAG
00_workflow_dag:
  dag_dir: "visual"
  log_dir: "logs/00_workflow_dag"
  final_target: "final_report/NA12878rep1-4.final_report.txt"

##############################################################
# Quality control module
01_quality_control:
  raw_fastqc_dir: "results/quality_control/raw_fastqc"
  raw_multiqc_dir: "results/quality_control/raw_multiqc"

##############################################################
# Preprocessing module
02_preprocessing:
  clean_fastqc_dir: "results/quality_control/clean_fastqc"
  clean_multiqc_dir: "results/quality_control/clean_multiqc"

trimming:
  min_length: 30
  fastp_extra_args: >
    --detect_adapter_for_pe
    --trim_poly_g 
    --trim_poly_x
    --cut_tail
    --cut_window_size 4 
    --cut_mean_quality 20 
    --qualified_quality_phred 20 
    --unqualified_percent_limit 40 
    --n_base_limit 5 

#############################################################
# Reference genome
03_reference:
  #local path where the reference genome in fasta will be stored
  fasta: "data/reference/hg38.fa"
  #url to download the reference genome
  url: "ftp://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz"
  #genome
  genome_build: "GRCh38"

################################################################
# Target region (CFTR)
target_region:
  bed: "test/database_cftr/cftr_mane_select_exons.bed"

################################################################
# Quality alignment
05_quality_alignment:
  qualimap_java_mem: "10G"
  qualimap_genome: "HUMAN"

################################################################
# Mark duplicates
06_mark_duplicates:
  read_groups:
    rglb: "lib1"
    rgpl: "ILLUMINA"
    rgpu: "unit1"
  mark_duplicates:
    assume_sorted: true
    remove_duplicates: false

################################################################
# Coverage
07_coverage:
  thresholds: "10,20,30,40"
  extra_args: "--no-per-base --flag 1024"

################################################################
# Variant calling
08_variant_calling:
  extra_args: "-C 5 --ploidy 2 --min-mapping-quality 20"

################################################################
# Variant filtering
09_variant_filtering:
  min_coverage: "5"
  min_quality: "20"

################################################################
# Annotation
10_annotation:
  header: "CHROM\tPOS\tID\tREF\tALT"
  query_format: "%CHROM\t%POS\t%ID\t%REF\t%ALT\n"

################################################################
# Final_report
11_final_report:
  disease: "Cystic Fibrosis"
  out_dir: "final_report"
  gene: "CFTR"