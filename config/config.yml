
#################This is the config.yml############################################
# Samples
samples_table_path: "config/samples.tsv"

##############################################################
paths:
  #local path for the raw data
  raw_reads: "data/raw"
  #sequencing type
  paired_end: true
  #local path for the clean data (after trimming)
  clean_reads: "data/clean"
  #path for the trimming results
  preprocessing_results: "results/preprocessing"

##############################################################
# Quality control module
01_quality_control:
  raw_fastqc_dir: "results/quality_control/raw_fastqc"
  raw_multiqc_dir: "results/quality_control/raw_multiqc"

##############################################################
# Preprocessing module
02_preprocessing:
  clean_fastqc_dir: "results/quality_control/clean_fastqc"
  clean_multiqc_dir: "results/quality_control/clean_multiqc"

trimming:
  min_length: 30
  fastp_extra_args: >
    --detect_adapter_for_pe
    --trim_poly_g 
    --trim_poly_x
    --cut_tail
    --cut_window_size 4 
    --cut_mean_quality 20 
    --qualified_quality_phred 20 
    --unqualified_percent_limit 40 
    --n_base_limit 5 

#############################################################
# Reference genome
03_reference:
  #local path where the reference genome in fasta will be stored
  fasta: "data/reference/hg38.fa"
  #url to download the reference genome
  url: "ftp://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz"

################################################################
# Quality alignment
05_quality_alignment:
  qualimap_java_mem: "10G"
  qualimap_genome: "HUMAN"

################################################################
# Mark duplicates
06_mark_duplicates:
  read_groups:
    rglb: "lib1"
    rgpl: "ILLUMINA"
    rgpu: "unit1"
  mark_duplicates:
    assume_sorted: true
    remove_duplicates: false

################################################################
# Coverage
07_coverage:
  bed: "data/database_cftr/cftr_mane_select_exons.bed"
  thresholds: "10,20,30,40"
  extra_args: "--no-per-base --flag 1024"
